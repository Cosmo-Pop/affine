name: tests

on:
  push:
    branches: [main, multi-backend]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [tensorflow, torch, jax]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install torch (CPU wheel)
        if: matrix.backend == 'torch'
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package
        run: pip install -e ".[${{ matrix.backend }},test]"
      - name: Run tests
        run: pytest tests/test_${{ matrix.backend }}.py -v
