[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "affine"
version = "1.0.0"
description = "Parallelized affine-invariant ensemble MCMC sampling in TensorFlow, PyTorch, and JAX"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Justin Alsing" },
    { name = "Jed Homer" },
]
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "tqdm",
]
keywords = ["mcmc", "sampling", "bayesian-inference", "ensemble-sampler", "affine-invariant"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
tensorflow = ["tensorflow>=2.0"]
torch = ["torch"]
jax = ["jax"]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/Cosmo-Pop/affine"
Issues = "https://github.com/Cosmo-Pop/affine/issues"

[tool.setuptools.packages.find]
include = ["affine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
